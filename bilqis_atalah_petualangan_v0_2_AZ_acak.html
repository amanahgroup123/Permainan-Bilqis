<style>

.big-number{font-size:64px;font-weight:1000;color:#e79a34;margin:0;text-shadow:0 5px 0 #ffe6b7}

.rabbit{font-size:123px;filter:drop-shadow(0 8px 3px #5c987445);line-height:1;transition:transform .25s}
.rabbit.happy{transform:scale(1.1) rotate(-8deg)}
.rabbit-world:after{content:"🌼 🌷 🌼";position:absolute;bottom:3px;left:15px;font-size:23px}
.feed-tray{margin:13px 0 15px;border-radius:22px;background:#fff6dc;padding:17px 9px;text-align:center}
.feed-tray p{margin:0 0 12px;font-weight:850;color:#9b7747;font-size:13px}
.carrots{display:flex;justify-content:center;gap:10px}
.carrot{width:77px;height:80px;border-radius:20px;border:3px solid #fff;border-bottom:6px solid #f0c979;background:#fff;font-size:46px;touch-action:none;user-select:none;position:relative;z-index:2}

.sticker-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px;font-size:28px}
/* All 26 letters, large touch targets and readable progress */
.alphabet-progress{background:#fff;border:2px solid #e9f0fc;border-radius:22px;padding:13px 14px;margin:0 0 12px}
.alphabet-info{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:900;color:#54718d}

.progress-track{height:11px;border-radius:999px;overflow:hidden;background:#e5eff6;margin:9px 0 12px}
.progress-fill{height:100%;background:linear-gradient(90deg,#68c8af,#83d88a);border-radius:999px;transition:width .3s ease}
.alphabet-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}

.letter-dot.learned{background:#c6f3d9;color:#267e58}

.alphabet-book-card:active{transform:scale(.97)}
.alphabet-book-card .book-emoji{font-size:28px}.alphabet-book-card .book-letter{font-size:30px;font-weight:1000;line-height:1}

/* Reward */
.reward{background:linear-gradient(180deg,#dcf7ff,#fff4cd 68%,#fffaf0);text-align:center;justify-content:center}

.settings h2{font-size:24px;margin:5px 0 6px}.settings .setting-card{border-radius:22px;background:#fff;border:2px solid #edf2f8;padding:15px;margin-top:13px}

@media(min-width:501px){body{padding:12px 0}#app{min-height:calc(100dvh - 24px);border-radius:31px;box-shadow:0 16px 60px #3d82a236}.screen{min-height:calc(100dvh - 24px)}}

<body>
<div id="app"><div class="screen" style="align-items:center;justify-content:center"><h2>🌈 Memulai Dunia Ajaib...</h2></div></div>
<script>
(() => {
'use strict';
const APP = document.getElementById('app');
const KEY = 'bilqis_atalah_v01_saved';
const games = {
  letters:{title:'Jelajah Huruf A–Z',emoji:'🔤',prize:'📚',name:'Buku Huruf'},
  count:{title:'Hitung Buah',emoji:'🍎',prize:'🧺',name:'Keranjang Ceria'},
  feed:{title:'Kelinci Lala',emoji:'🐰',prize:'🥕',name:'Wortel Emas'}
};
const words = [
 {letter:'A',noun:'apel',emoji:'🍎',sound:'a'},
 {letter:'B',noun:'bola',emoji:'⚽',sound:'be'},
 {letter:'C',noun:'cicak',emoji:'🦎',sound:'ce'},
 {letter:'D',noun:'dadu',emoji:'🎲',sound:'de'},
 {letter:'E',noun:'elang',emoji:'🦅',sound:'e'},
 {letter:'F',noun:'foto',emoji:'📸',sound:'ef'},
 {letter:'G',noun:'gajah',emoji:'🐘',sound:'ge'},
 {letter:'H',noun:'harimau',emoji:'🐯',sound:'ha'},
 {letter:'I',noun:'ikan',emoji:'🐟',sound:'i'},
 {letter:'J',noun:'jeruk',emoji:'🍊',sound:'je'},
 {letter:'K',noun:'kelinci',emoji:'🐰',sound:'ka'},
 {letter:'L',noun:'lebah',emoji:'🐝',sound:'el'},
 {letter:'M',noun:'mobil',emoji:'🚗',sound:'em'},
 {letter:'N',noun:'nanas',emoji:'🍍',sound:'en'},
 {letter:'O',noun:'obor',emoji:'🔥',sound:'o'},
 {letter:'P',noun:'pisang',emoji:'🍌',sound:'pe'},
 {letter:'Q',noun:'quokka',emoji:'🦘',sound:'kiu'},
 {letter:'R',noun:'roti',emoji:'🍞',sound:'er'},
 {letter:'S',noun:'sapi',emoji:'🐮',sound:'es'},
 {letter:'T',noun:'topi',emoji:'🧢',sound:'te'},
 {letter:'U',noun:'ular',emoji:'🐍',sound:'u'},
 {letter:'V',noun:'vas',emoji:'🏺',sound:'ve'},
 {letter:'W',noun:'wortel',emoji:'🥕',sound:'we'},
 {letter:'X',noun:'xilofon',emoji:'🎼',sound:'eks'},
 {letter:'Y',noun:'yoyo',emoji:'🪀',sound:'ye'},
 {letter:'Z',noun:'zebra',emoji:'🦓',sound:'zet'}
];
const alphabetLetters = words.map(w=>w.letter);
const byLetter = Object.fromEntries(words.map(w=>[w.letter,w]));
const shuffle = items => {
 const out=[...items];
 for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
 return out;
};
function freshAlphabet(excludeFirst=''){
 const remaining=shuffle(alphabetLetters);
 if(excludeFirst&&remaining[0]===excludeFirst&&remaining.length>1){[remaining[0],remaining[1]]=[remaining[1],remaining[0]]}
 return {remaining,mastered:[],cycles:0,totalSolved:0,lastLetter:excludeFirst};
}
function validateAlphabet(v){
 if(!v||typeof v!=='object'||!Array.isArray(v.remaining)||!Array.isArray(v.mastered))return null;
 const rem=v.remaining.filter(l=>alphabetLetters.includes(l)),mas=v.mastered.filter(l=>alphabetLetters.includes(l));
 const unique=[...new Set([...rem,...mas])];
 if(unique.length!==26||new Set(rem).size!==rem.length||new Set(mas).size!==mas.length||rem.some(l=>mas.includes(l)))return null;
 return {...v,remaining:rem,mastered:mas,cycles:Number(v.cycles)||0,totalSolved:Number(v.totalSolved)||0,lastLetter:String(v.lastLetter||'')};
}
function makeQuestion(letter){
 const choices=shuffle([letter,...shuffle(alphabetLetters.filter(l=>l!==letter)).slice(0,2)]);
 return {...byLetter[letter],options:choices};
}

}

 if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 const now=audioCtx.currentTime;
 const seq=kind==='win'?[523,659,784,1047]:kind==='success'?[523,659,784]:kind==='no'?[330,280]:[650];
 seq.forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),start=now+i*(kind === 'tap' ? 0 : 0.095);osc.type='sine';osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.11,start+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+.15);osc.connect(gain).connect(audioCtx.destination);osc.start(start);osc.stop(start+.16)});
 }catch(e){console.debug('Audio tidak tersedia:',e)}
}
function speak(text){
 if(!saved.sound)return;
 try{
 if(!('speechSynthesis' in window))return;
 const synth=window.speechSynthesis;synth.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.86;u.pitch=1.09;u.volume=1;if(availableVoice)u.voice=availableVoice;
 synth.speak(u);
 }catch(e){console.debug('Narasi tidak tersedia:',e)}
}
function narrate(){speak(messageFor())}
function go(s){screen=s;wrong='';render();window.scrollTo(0,0)}
function enterGame(key,mode='short'){
 if(!games[key])return;
 task=key;stage=0;wrong='';chosen=new Set();feed=0;
 if(key==='letters'){
  if(saved.alphabet.remaining.length===0){
   const last=saved.alphabet.lastLetter;
   const old=saved.alphabet;
   saved.alphabet={...freshAlphabet(last),cycles:old.cycles,totalSolved:old.totalSolved};
  }
  const rem=saved.alphabet.remaining;
  letterMode=mode;
  // Short sessions are child-friendly; full mode plays every remaining letter.
  letterSession=rem.slice(0,mode==='full'?rem.length:(rem.length<=6?6:5)).map(makeQuestion);
  safeStore();
 }
 go(key);tone('tap');narrate();
}
function award(){if(!done(task)){saved.completed.push(task);safeStore()}go('reward');tone('win');narrate()}
function feedOne(){if(screen!=='feed'||feed>=3)return;feed++;tone(feed===3?'success':'tap');render();if(feed===3)speak('Hore! Lala sudah kenyang! Terima kasih, Bilqis!');else speak(`${feed}. Ayo kasih wortel lagi!`)}
function walk(evt){
 if(screen!=='map')return;
 const zone=document.getElementById('scene'),box=zone.getBoundingClientRect();moveX=Math.max(23,Math.min(77,(evt.clientX-box.left)/box.width*100));walking=true;
 const el=document.getElementById('walkers');if(el){el.style.left=moveX+'%';el.classList.add('walk')}
 setTimeout(()=>{walking=false;const current=document.getElementById('walkers');if(current)current.classList.remove('walk')},850);
 tone();
}
function resetAsk(){
 // Two-step protective prompt: buttons are behind a parent confirmation screen.
 const result=window.prompt('Khusus orang tua: berapa hasil 3 + 4? Ketik jawabannya untuk menghapus progres.');
 if(result===null)return;
 if(result.trim()==='7'){saved.completed=[];saved.alphabet=freshAlphabet();safeStore();tone('success');render();alert('Progres belajar telah direset.')}else alert('Jawabannya belum benar. Progres tidak berubah.');
}
APP.addEventListener('click',evt=>{
 const el=evt.target.closest('[data-action]');if(!el)return;
 const action=el.dataset.action;
 if(action==='feed-carrot' && Date.now()<ignoreClickUntil)return;
 switch(action){
 case 'start':go('map');tone('success');narrate();break;
 case 'back': if(screen==='settings'){go(window._fromScreen||'home')}else if(screen==='map'){go('home')}else if(screen==='reward'){go('map')}else{go('map')}tone();break;
 case 'map':go('map');tone();narrate();break;
 case 'walk':walk(evt);break;
 case 'open-task':enterGame(el.dataset.game);break;
 case 'open-full-letters':enterGame('letters','full');break;
 case 'open-book':go('book');tone();narrate();break;
 case 'listen-letter':{
  const w=byLetter[el.dataset.letter];if(!w)break;
  tone('tap');speak(`Huruf ${w.sound}. ${w.sound} untuk ${w.noun}. Ayo ucapkan, ${w.sound}!`);
  break;
 }
 case 'pick-letter': {
  if(wrong==='correct')break;
  const w=letterSession[stage];if(!w)break;
  const isGood=el.dataset.letter===w.letter;
  wrong=isGood?'correct':el.dataset.letter;
  if(isGood){
   const a=saved.alphabet;
   if(!a.mastered.includes(w.letter)){
    a.mastered.push(w.letter);
    a.remaining=a.remaining.filter(l=>l!==w.letter);
    a.totalSolved++;a.lastLetter=w.letter;
    if(a.mastered.length===26)a.cycles++;
    safeStore();
   }
  }
  tone(isGood?'success':'no');render();
  if(isGood)narrate();else speak('Hehe, belum yang itu. Coba lagi, yuk Bilqis!');
  break;
 }
 case 'next-letter':if(wrong!=='correct')break;if(stage>=letterSession.length-1)award();else{stage++;wrong='';render();tone('tap');narrate()}break;
 case 'tap-fruit':{
  const index=Number(el.dataset.idx),r=rounds[stage];if(chosen.has(index)||chosen.size>=r.n)break;
  chosen.add(index);tone(chosen.size===r.n?'success':'tap');render();
  if(chosen.size===r.n)narrate();else speak(String(chosen.size));break;
 }
 case 'next-count':if(stage>=rounds.length-1)award();else{stage++;chosen=new Set();render();tone();narrate()}break;
 case 'feed-carrot':feedOne();break;
 case 'end-feed':award();break;
 case 'replay-game':enterGame(task,letterMode);break;
 case 'replay':tone('tap');narrate();break;
 case 'open-settings':window._fromScreen=screen;go('settings');break;
 case 'toggle-sound':saved.sound=!saved.sound;safeStore();if(!saved.sound&&'speechSynthesis'in window)try{speechSynthesis.cancel()}catch(e){}render();if(saved.sound){tone('success');speak('Suara sudah aktif. Halo Bilqis dan Abang Atalah!')}break;
 case 'test-sound':tone('success');speak('Halo Bilqis! Ini Abang Atalah. Ayo kita bermain di Hutan Ajaib!');break;
 case 'reset-ask':resetAsk();break;
 default:break;
 }
});
// Reliable pointer dragging on mobile; tapping remains a fully supported alternative.
APP.addEventListener('pointerdown',evt=>{
 const el=evt.target.closest('[data-action="feed-carrot"]');if(!el||el.disabled||screen!=='feed')return;
 drag={el,startX:evt.clientX,startY:evt.clientY,moved:false};
 try{el.setPointerCapture(evt.pointerId)}catch(e){}
});
APP.addEventListener('pointermove',evt=>{
 if(!drag||screen!=='feed')return;
 const dx=evt.clientX-drag.startX,dy=evt.clientY-drag.startY;
 if(Math.hypot(dx,dy)>9)drag.moved=true;
 if(drag.moved){drag.el.classList.add('dragging');drag.el.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`}
});
function endDrag(evt){
 if(!drag)return;
 const d=drag;drag=null;d.el.style.transform='';d.el.classList.remove('dragging');
 if(!d.moved)return; // regular click is handled above
 ignoreClickUntil=Date.now()+500;
 const target=document.getElementById('rabbit-target');if(!target)return;
 const r=target.getBoundingClientRect();
 if(evt.clientX>=r.left-24&&evt.clientX<=r.right+24&&evt.clientY>=r.top-24&&evt.clientY<=r.bottom+24)feedOne();
 else speak('Geser wortelnya ke kelinci Lala, ya!');
}
APP.addEventListener('pointerup',endDrag);APP.addEventListener('pointercancel',()=>{if(drag){drag.el.style.transform='';drag.el.classList.remove('dragging')}drag=null});
// App is intentionally completely self-contained: no requests, trackers, or external libraries.
render();
})();
</script>
